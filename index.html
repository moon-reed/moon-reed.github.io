<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>徽标设计匿名投票</title>
<style>
  :root {
    --bg: #0a0e14;
    --bg2: #10151d;
    --card: #161c26;
    --card-hover: #1b2330;
    --border: #232c3a;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #6366f1;
    --accent2: #22d3ee;
    --danger: #ef4444;
    --ok: #22c55e;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #141b2b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10, 14, 20, 0.82);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px 0;
  }
  h1 {
    font-size: 19px; font-weight: 700; letter-spacing: .5px;
    display: flex; align-items: center; gap: 8px;
  }
  h1 .grad {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tabs { display: flex; gap: 4px; margin-top: 12px; }
  .tab {
    flex: 1; padding: 11px 0 13px; background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 15px; font-weight: 600; position: relative;
  }
  .tab.active { color: var(--text); }
  .tab.active::after {
    content: ""; position: absolute; left: 20%; right: 20%; bottom: 0; height: 3px;
    border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 90px; }
  .panel { display: none; animation: fade .25s ease; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .vote-status {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 12px;
  }
  .pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 100px;
    padding: 7px 14px; font-size: 13.5px; color: var(--muted); font-weight: 600;
  }
  .pill b { color: var(--accent2); font-size: 15px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 2px solid var(--border); border-radius: var(--radius);
    overflow: hidden; cursor: pointer; transition: transform .12s ease, border-color .12s ease, box-shadow .12s;
    position: relative; user-select: none;
  }
  .card:active { transform: scale(.98); }
  .card:hover { border-color: #33415a; }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .25), 0 8px 24px rgba(99,102,241,.15);
  }
  .card .thumb {
    width: 100%; aspect-ratio: 1; background: #0c1118 center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .thumb .placeholder { color: #3b4a5f; font-size: 34px; }
  .card .meta { padding: 10px 11px 12px; }
  .card .name {
    font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; margin-bottom: 4px;
  }
  .card .votes { font-size: 12px; color: var(--muted); }
  .card .votes b { color: var(--accent2); }
  .check {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(10,14,20,.7); border: 2px solid #556; display: flex;
    align-items: center; justify-content: center; font-size: 15px; color: #fff;
    transition: all .12s;
  }
  .card.selected .check { background: var(--accent); border-color: var(--accent); }

  .sticky-submit {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(10,14,20,.85); backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
  }
  .sticky-submit .inner { max-width: 980px; margin: 0 auto; }

  button.primary {
    background: linear-gradient(90deg, var(--accent), #7c3aed); color: #fff; border: none;
    border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity .12s, transform .12s;
  }
  button.primary:hover { opacity: .92; }
  button.primary:active { transform: scale(.98); }
  button.primary:disabled { opacity: .4; cursor: not-allowed; }
  button.big { width: 100%; padding: 15px; font-size: 16px; }
  button.danger {
    background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.4);
    border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.danger:hover { background: rgba(239,68,68,.25); }

  .drop-zone {
    border: 2px dashed var(--border); border-radius: var(--radius); padding: 34px 20px;
    text-align: center; cursor: pointer; transition: border-color .12s, background .12s;
    margin-bottom: 14px;
  }
  .drop-zone:hover, .drop-zone.drag { border-color: var(--accent); background: rgba(99,102,241,.06); }
  .drop-zone p { color: var(--muted); font-size: 14px; }
  .drop-zone p:first-child { font-size: 16px; color: var(--text); margin-bottom: 4px; }
  .drop-zone .hint { font-size: 12.5px; }
  .drop-zone .preview { max-width: 220px; max-height: 160px; margin-top: 12px; border-radius: 10px; border: 1px solid var(--border); }

  .text-input {
    width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 13px 15px; color: var(--text); font-size: 15px; outline: none; margin-bottom: 14px;
    transition: border-color .12s;
  }
  .text-input:focus { border-color: var(--accent); }

  .msg { margin-top: 12px; font-size: 13.5px; min-height: 20px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: #fca5a5; }

  .locked {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .locked .icon { font-size: 46px; margin-bottom: 12px; }
  .locked p { font-size: 14.5px; }

  .results-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
  .results-head .total { color: var(--muted); font-size: 13.5px; }
  .results-head .total b { color: var(--accent2); }

  .rank-item {
    display: flex; align-items: center; gap: 13px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; margin-bottom: 10px;
  }
  .rank-item .pos {
    width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex;
    align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
  }
  .pos.gold { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #1a1200; }
  .pos.silver { background: linear-gradient(135deg, #94a3b8, #cbd5e1); color: #0f172a; }
  .pos.bronze { background: linear-gradient(135deg, #b45309, #d97706); color: #fff; }
  .pos.norm { background: var(--bg2); color: var(--muted); }
  .rank-item .rimg { width: 52px; height: 52px; border-radius: 10px; overflow: hidden; flex: none; background: #0c1118; }
  .rank-item .rimg img { width: 100%; height: 100%; object-fit: cover; }
  .rank-item .rinfo { flex: 1; min-width: 0; }
  .rank-item .rname { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-item .rbar { height: 7px; background: var(--bg2); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .rank-item .rbar .fill {
    height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .5s ease;
  }
  .rank-item .rcount { flex: none; text-align: right; }
  .rank-item .rcount b { font-size: 20px; color: var(--accent2); }
  .rank-item .rcount span { display: block; font-size: 11px; color: var(--muted); }

  footer { text-align: center; padding: 20px; }
  footer #admin-link { color: #3b4a5f; font-size: 12.5px; cursor: pointer; }
  footer #admin-link:hover { color: var(--muted); }

  .modal {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal[hidden] { display: none; }
  .modal-box {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 22px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
  }
  .modal-box h2 { font-size: 17px; margin-bottom: 14px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions button { flex: 1; }
  .admin-btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .admin-btn-row button { flex: 1; }
  .admin-list { margin-top: 16px; }
  .admin-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .admin-item .aname { flex: 1; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .admin-item .avotes { font-size: 12px; color: var(--muted); }
  .admin-item button { padding: 6px 11px; font-size: 12.5px; }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 18px; font-size: 14px; z-index: 100; opacity: 0; pointer-events: none;
    transition: all .25s ease; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: rgba(34,197,94,.5); color: var(--ok); }
  #toast.err { border-color: rgba(239,68,68,.5); color: #fca5a5; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 11px; }
    main { padding: 16px 12px 90px; }
  }
</style>
</head>
<body>

<header>
  <h1>🎨 <span class="grad">徽标设计匿名投票</span></h1>
  <nav class="tabs">
    <button class="tab active" data-tab="vote">投票</button>
    <button class="tab" data-tab="upload">上传</button>
    <button class="tab" data-tab="results">结果</button>
  </nav>
</header>

<main>
  <!-- 投票面板 -->
  <section id="panel-vote" class="panel active">
    <div class="vote-status">
      <span class="pill" id="selected-pill">已选 <b id="selected-count">0</b>/<span id="max-count">3</span></span>
      <span class="pill" id="voted-pill" hidden>✅ 已投票</span>
    </div>
    <div id="design-grid" class="grid"></div>
    <div id="empty-hint" class="locked" hidden>
      <div class="icon">🖼️</div>
      <p>还没有设计，快去「上传」里添加吧～</p>
    </div>
  </section>

  <!-- 上传面板 -->
  <section id="panel-upload" class="panel">
    <div id="drop-zone" class="drop-zone">
      <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
      <p>📁 点击或拖拽图片到这里</p>
      <p class="hint">支持 PNG / JPG / WebP，自动压缩到合适尺寸</p>
      <img id="preview" class="preview" hidden alt="预览">
    </div>
    <input type="text" id="design-name" class="text-input" placeholder="设计名称 / 作者（可选，最多 100 字）" maxlength="100">
    <button id="do-upload" class="primary big" disabled>上传设计</button>
    <div id="upload-msg" class="msg"></div>
  </section>

  <!-- 结果面板 -->
  <section id="panel-results" class="panel">
    <div id="results-content"></div>
  </section>
</main>

<div class="sticky-submit" id="sticky-submit">
  <div class="inner">
    <button id="submit-vote" class="primary big" disabled>提交投票 (0)</button>
  </div>
</div>

<footer><span id="admin-link">管理入口</span></footer>

<!-- 管理弹窗 -->
<div id="admin-modal" class="modal" hidden>
  <div class="modal-box">
    <h2>🔐 管理员</h2>
    <input type="password" id="admin-pw" class="text-input" placeholder="请输入管理员密码">
    <div class="modal-actions">
      <button id="admin-login" class="primary">进入</button>
      <button id="admin-cancel">取消</button>
    </div>
    <div id="admin-panel" hidden>
      <div class="admin-btn-row">
        <button id="admin-reset" class="danger">清空所有投票</button>
        <button id="admin-clear" class="danger">清空所有设计</button>
      </div>
      <div class="admin-list" id="admin-design-list"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------- 状态 ----------
  const state = {
    designs: [],
    maxChoices: 3,
    hasVoted: false,
    myVotes: [],
    showResults: false,
    results: null,
    totalVoters: 0,
    selected: new Set(),
    adminPw: '',
    pendingFile: null,
  };

  const $ = (id) => document.getElementById(id);
  const toast = $('toast');

  // ---------- 匿名标识（localStorage，跨会话保持） ----------
  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  let voterId = localStorage.getItem('lv_voter_id');
  if (!voterId) { voterId = genId(); localStorage.setItem('lv_voter_id', voterId); }

  // ---------- 工具 ----------
  function showToast(msg, ok) {
    toast.textContent = msg;
    toast.className = 'show ' + (ok ? 'ok' : 'err');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.className = '', 2200);
  }

  async function api(path, body) {
    const opts = body ? {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    } : {};
    const r = await fetch(path, opts);
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(data.error || ('请求失败 ' + r.status));
    return data;
  }

  // ---------- 初始化 ----------
  async function load() {
    try {
      const d = await api('/api/bootstrap?voter_id=' + encodeURIComponent(voterId));
      state.designs = d.designs;
      state.maxChoices = d.max_choices;
      state.hasVoted = d.has_voted;
      state.myVotes = new Set(d.my_votes);
      state.showResults = d.show_results;
      state.results = d.results;
      state.totalVoters = d.total_voters;
      state.selected = new Set(state.hasVoted ? state.myVotes : []);
      $('max-count').textContent = state.maxChoices;
      renderVote();
      renderResults();
    } catch (e) {
      showToast('加载失败: ' + e.message, false);
    }
  }

  // ---------- 投票面板 ----------
  function renderVote() {
    const grid = $('design-grid');
    grid.innerHTML = '';
    $('empty-hint').hidden = state.designs.length > 0;

    state.designs.forEach((d) => {
      const card = document.createElement('div');
      card.className = 'card' + (state.selected.has(d.id) ? ' selected' : '');
      const votes = countVotes(d.id);
      card.innerHTML =
        '<div class="thumb"><img src="/uploads/' + d.file + '" alt="" loading="lazy">' +
        '</div><div class="meta"><div class="name"></div>' +
        '<div class="votes">' + (state.showResults ? '👍 <b>' + votes + '</b> 票' : '🖼 点击选择') +
        '</div></div><div class="check">✓</div>';
      card.querySelector('.name').textContent = d.name;
      card.addEventListener('click', () => toggle(d.id, card));
      grid.appendChild(card);
    });
    updateSelectionUI();
  }

  function countVotes(id) {
    if (!state.results) return 0;
    const r = state.results.find((x) => x.id === id);
    return r ? r.votes : 0;
  }

  function toggle(id, card) {
    if (state.selected.has(id)) {
      state.selected.delete(id);
      card.classList.remove('selected');
    } else {
      if (state.selected.size >= state.maxChoices) {
        showToast('最多选 ' + state.maxChoices + ' 个哦', false);
        return;
      }
      state.selected.add(id);
      card.classList.add('selected');
    }
    updateSelectionUI();
  }

  function updateSelectionUI() {
    const n = state.selected.size;
    $('selected-count').textContent = n;
    $('voted-pill').hidden = !state.hasVoted;
    const btn = $('submit-vote');
    btn.textContent = state.hasVoted
      ? '更新投票 (' + n + '/' + state.maxChoices + ')'
      : '提交投票 (' + n + '/' + state.maxChoices + ')';
    btn.disabled = n === 0;
  }

  async function submitVote() {
    if (state.selected.size === 0) return;
    const btn = $('submit-vote');
    btn.disabled = true;
    try {
      await api('/api/vote', { voter_id: voterId, choices: [...state.selected] });
      state.hasVoted = true;
      state.myVotes = new Set(state.selected);
      showToast('投票成功！感谢参与 🎉', true);
      await load(); // 重新拉取结果
    } catch (e) {
      showToast('投票失败: ' + e.message, false);
      btn.disabled = state.selected.size === 0;
    }
  }

  // ---------- 上传面板 ----------
  const dropZone = $('drop-zone');
  const fileInput = $('file-input');
  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) setFile(e.target.files[0]); });
  ['dragover', 'dragenter'].forEach((ev) => dropZone.addEventListener(ev, (e) => {
    e.preventDefault(); dropZone.classList.add('drag');
  }));
  ['dragleave', 'drop'].forEach((ev) => dropZone.addEventListener(ev, (e) => {
    e.preventDefault(); dropZone.classList.remove('drag');
  }));
  dropZone.addEventListener('drop', (e) => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) setFile(f);
  });

  function setFile(file) {
    if (!file.type.startsWith('image/')) { showToast('请选择图片文件', false); return; }
    state.pendingFile = file;
    const url = URL.createObjectURL(file);
    const pv = $('preview');
    pv.src = url; pv.hidden = false;
    $('do-upload').disabled = false;
  }

  // canvas 压缩：最长边 <= 1400px，PNG 保留透明，其余转 JPEG
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const isPng = file.type === 'image/png';
          const mime = isPng ? 'image/png' : 'image/jpeg';
          resolve({ dataUrl: canvas.toDataURL(mime, quality), mime });
        };
        img.onerror = () => reject(new Error('图片解析失败'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('文件读取失败'));
      reader.readAsDataURL(file);
    });
  }

  async function doUpload() {
    if (!state.pendingFile) return;
    const btn = $('do-upload');
    const msg = $('upload-msg');
    btn.disabled = true; btn.textContent = '上传中…';
    msg.textContent = ''; msg.className = 'msg';
    try {
      const { dataUrl, mime } = await compressImage(state.pendingFile, 1400, 0.85);
      await api('/api/upload', { name: $('design-name').value, image: dataUrl, mime });
      msg.textContent = '✅ 上传成功！';
      msg.className = 'msg ok';
      showToast('上传成功', true);
      state.pendingFile = null;
      $('design-name').value = '';
      $('preview').hidden = true;
      $('preview').src = '';
      fileInput.value = '';
      await load();
    } catch (e) {
      msg.textContent = '上传失败: ' + e.message;
      msg.className = 'msg err';
      showToast('上传失败: ' + e.message, false);
    } finally {
      btn.disabled = !state.pendingFile;
      btn.textContent = '上传设计';
    }
  }

  // ---------- 结果面板 ----------
  function renderResults() {
    const box = $('results-content');
    box.innerHTML = '';
    if (!state.showResults) {
      box.innerHTML = '<div class="locked"><div class="icon">🔒</div>' +
        '<p>结果将在<b>投票后</b>可见，保证投票公平～</p>' +
        '<p style="margin-top:6px;font-size:13px">提交你的投票即可查看排名</p></div>';
      return;
    }
    if (!state.results || state.results.length === 0) {
      box.innerHTML = '<div class="locked"><div class="icon">📊</div><p>暂无数据</p></div>';
      return;
    }
    const maxVotes = Math.max(1, ...state.results.map((r) => r.votes));
    const head = document.createElement('div');
    head.className = 'results-head';
    head.innerHTML = '<div>共 <b>' + state.totalVoters + '</b> 人参与投票</div>' +
      '<div class="total">共 ' + state.results.length + ' 个设计</div>';
    box.appendChild(head);

    state.results.forEach((r, i) => {
      const pct = r.votes > 0 ? Math.round(r.votes / maxVotes * 100) : 0;
      const item = document.createElement('div');
      item.className = 'rank-item';
      const pos = document.createElement('div');
      pos.className = 'pos ' + (i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : 'norm');
      pos.textContent = i + 1;
      const rimg = document.createElement('div');
      rimg.className = 'rimg';
      const img = document.createElement('img');
      img.src = '/uploads/' + r.file;
      rimg.appendChild(img);
      const rinfo = document.createElement('div');
      rinfo.className = 'rinfo';
      const rname = document.createElement('div');
      rname.className = 'rname';
      rname.textContent = r.name;
      const rbar = document.createElement('div');
      rbar.className = 'rbar';
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.width = pct + '%';
      rbar.appendChild(fill);
      rinfo.appendChild(rname);
      rinfo.appendChild(rbar);
      const rcount = document.createElement('div');
      rcount.className = 'rcount';
      const b = document.createElement('b');
      b.textContent = r.votes;
      const span = document.createElement('span');
      span.textContent = '票';
      rcount.appendChild(b);
      rcount.appendChild(span);
      item.appendChild(pos);
      item.appendChild(rimg);
      item.appendChild(rinfo);
      item.appendChild(rcount);
      box.appendChild(item);
    });
  }

  // ---------- Tab 切换 ----------
  document.querySelectorAll('.tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
      tab.classList.add('active');
      $('panel-' + tab.dataset.tab).classList.add('active');
      $('sticky-submit').style.display = tab.dataset.tab === 'vote' ? '' : 'none';
    });
  });

  // ---------- 管理 ----------
  $('admin-link').addEventListener('click', () => {
    $('admin-modal').hidden = false;
    $('admin-pw').value = '';
    $('admin-panel').hidden = true;
  });
  $('admin-cancel').addEventListener('click', () => $('admin-modal').hidden = true);
  $('admin-modal').addEventListener('click', (e) => { if (e.target === $('admin-modal')) $('admin-modal').hidden = true; });

  async function adminLogin() {
    const pw = $('admin-pw').value;
    if (!pw) return;
    try {
      const d = await api('/api/admin', { action: 'list', password: pw });
      state.adminPw = pw;
      $('admin-panel').hidden = false;
      renderAdminList(d.designs, d.total_voters);
    } catch (e) {
      showToast('密码错误', false);
    }
  }
  $('admin-login').addEventListener('click', adminLogin);
  $('admin-pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') adminLogin(); });

  function renderAdminList(designs, total) {
    const list = $('admin-design-list');
    list.innerHTML = '<div style="margin-top:8px;font-size:13px;color:var(--muted)">共 ' +
      total + ' 人投票 · ' + designs.length + ' 个设计</div>';
    designs.forEach((d) => {
      const item = document.createElement('div');
      item.className = 'admin-item';
      const name = document.createElement('span'); name.className = 'aname'; name.textContent = d.name;
      const votes = document.createElement('span'); votes.className = 'avotes'; votes.textContent = d.votes + ' 票';
      const del = document.createElement('button'); del.className = 'danger'; del.textContent = '删除';
      del.addEventListener('click', async () => {
        try {
          await api('/api/admin', { action: 'delete', id: d.id, password: state.adminPw });
          showToast('已删除', true);
          adminLogin();
          await load();
        } catch (e) { showToast(e.message, false); }
      });
      item.appendChild(name); item.appendChild(votes); item.appendChild(del);
      list.appendChild(item);
    });
  }

  $('admin-reset').addEventListener('click', async () => {
    if (!confirm('确定清空所有投票记录？')) return;
    try {
      await api('/api/admin', { action: 'reset', password: state.adminPw });
      showToast('已清空投票', true);
      await load();
    } catch (e) { showToast(e.message, false); }
  });
  $('admin-clear').addEventListener('click', async () => {
    if (!confirm('确定删除所有设计（含图片）？')) return;
    try {
      await api('/api/admin', { action: 'clear_designs', password: state.adminPw });
      showToast('已清空设计', true);
      adminLogin();
      await load();
    } catch (e) { showToast(e.message, false); }
  });

  // ---------- 事件绑定 ----------
  $('submit-vote').addEventListener('click', submitVote);
  $('do-upload').addEventListener('click', doUpload);

  load();
})();
</script>
</body>
</html>
